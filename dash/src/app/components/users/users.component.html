<div class="section-header">
  <h1>Users Section</h1>
</div>
<div class="row">
  <div class="col-3 col-md-3 col-lg-3">
    <div class="form-group">
      <label>Start time Picker</label>
      <input #start_time type="text" class="form-control datetimepicker">
    </div>
  </div>
  <div class="col-3 col-md-3 col-lg-3">
    <div class="form-group">
      <label>End time Picker</label>
      <input #end_time type="text" class="form-control datetimepicker">
    </div>
  </div>
  <div class="col-3 col-md-3 col-lg-3">
    <div class="form-group">
      <label>IP Address</label>
      <input #ip_addr type="text" class="form-control text">
    </div>
  </div>
  <div class="col-3 col-md-3 col-lg-3">
    <div class="form-group">
      <label></label>
      <a (click)="goSearch(start_time.value, end_time.value, ip_addr.value)" class="btn btn-lg btn-primary">GO!</a>
    </div>
  </div>
</div>

<div class="row">

  <div class="col-12 col-md-12 col-lg-12">
    <div class="card">
      <div class="card-header">
        <h4>Users count {{users.length}}</h4>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-md">
            <tbody>
              <tr>
                <th>#</th>
                <th>Ip Address</th>
                <th>Entered On</th>
                <th>ID</th>
                <th>_id</th>
                <th>Name</th>
              </tr>
              <tr *ngFor="let us of users; index as i">
                <td>{{i+1}}</td>
                <td>{{us.ip}}</td>
                <td>{{us.firstEnter | date: 'yyyy-MM-dd HH:MM:ss'}}</td>
                <td>{{us.id}}</td>
                <td>{{us._id}}</td>
                <td>{{us.name}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer text-right">

      </div>
    </div>
  </div>
</div>
