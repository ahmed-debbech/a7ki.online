<div class="section-header">
  <h1>Users Section</h1>
</div>
<div class="row">
  <div class="col-4 col-md-4 col-lg-4">
    <div class="form-group">
      <label>Start time Picker</label>
      <input #start_time type="text" class="form-control datetimepicker">
    </div>
  </div>
  <div class="col-4 col-md-4 col-lg-4">
    <div class="form-group">
      <label>End time Picker</label>
      <input #end_time type="text" class="form-control datetimepicker">
    </div>
  </div>
  <div class="col-4 col-md-4 col-lg-4">
    <div class="form-group">
      <a (click)="goSearch(start_time.value, end_time.value)" class="btn btn-primary">GO!</a>
    </div>
  </div>
</div>

<div class="row">

  <div class="col-12 col-md-12 col-lg-12">
    <div class="card">
      <div class="card-header">
        <h4>Full Width</h4>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-md">
            <tbody>
              <tr>
                <th>#</th>
                <th>Ip Address</th>
                <th>Entered On</th>
                <th>ID</th>
                <th>_id</th>
                <th>Name</th>
                <th>Action</th>
              </tr>
              <tr *ngFor="let us of users; index as i">
                <td>{{i+1}}</td>
                <td>{{us.ip}}</td>
                <td>{{us.firstEnter | date: 'yyyy-MM-dd HH:MM:ss'}}</td>
                <td>{{us.id}}</td>
                <td>{{us._id}}</td>
                <td>{{us.name}}</td>

                <td>
                  <div class="badge badge-success">Active</div>
                </td>
                <td><a href="#" class="btn btn-secondary">Detail</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer text-right">
        <nav class="d-inline-block">
          <ul class="pagination mb-0">
            <li class="page-item disabled">
              <a class="page-link" href="#" tabindex="-1"><i class="fas fa-chevron-left"></i></a>
            </li>
            <li class="page-item active"><a class="page-link" href="#">1 <span class="sr-only">(current)</span></a></li>
            <li class="page-item">
              <a class="page-link" href="#">2</a>
            </li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item">
              <a class="page-link" href="#"><i class="fas fa-chevron-right"></i></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
